<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Tables</title>
</head>
<body>
    <!-- Tables in html are used to present data in tabular form i.e having rows and columns. 
     To introduce a table we use the table tag element. This tag elements comes with two important attributes i.e border and the width.
     
     To bring about the row of a table, we use the tr tag element. Normally, the first row of a table it contains the heading to different columns and in this case we use the th tag element.
     
     All the other data cells for a table we use the td tag element. (Table data).-->

     <table border="2px" width="80%">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Cost</th>
        </tr>
        <tr>
            <td>1001</td>
            <td>Delmonte</td>
            <td>250</td>
        </tr>
        <tr>
            <td>1002</td>
            <td>Mango Juice</td>
            <td>350</td>
        </tr>
        <tr>
            <td>1003</td>
            <td>Pineapple Juice</td>
            <td>550</td>
        </tr>
     </table>
</body>
</html>
