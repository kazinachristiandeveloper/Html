<body>
    <!-- Images are two dimensional figures meaning they contain height and the width. Images are introduced by the use of the img tag element. This tag element comes with two very important attributes i.e src indicating the source and alt indicating the alternative text incase the image is missing or the path is incorrect. (An attribute is used to give more features/characterist to a tag element it is usually applied on the start tag of a tag element.) The img tag element is an empty tag element meaning it does not have a closing tag.-->
